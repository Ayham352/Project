{% extends "base.html" %}
{% block content %}
<h1>Play Snakes &amp; Ladders online</h1>
<p class="muted">Create a game, share its code with friends (2 to 4 players), and take turns rolling the dice.</p>
<div class="grid2">
  <form class="card" method="post" action="{{ url_for('login') }}">
    <h2>Log in</h2>
    <label for="lu">Username</label><input id="lu" name="username" required>
    <label for="lp">Password</label><input id="lp" name="password" type="password" required>
    <button>Log in</button>
  </form>
  <form class="card" method="post" action="{{ url_for('register') }}">
    <h2>Create an account</h2>
    <label for="ru">Username (3-30 characters)</label><input id="ru" name="username" required>
    <label for="rp">Password (at least 6 characters)</label><input id="rp" name="password" type="password" required>
    <button>Sign up</button>
  </form>
</div>
{% endblock %}
