<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Snakes &amp; Ladders{% endblock %}</title>
<style>
  :root { --ink:#1f2933; --muted:#616e7c; --line:#d9e2ec; --bg:#f5f7fa; --card:#fff;
          --accent:#2f6f4f; --ladder:#d8f3dc; --snake:#fde2e1; --gold:#f7c948; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.5; }
  header { background:var(--accent); color:#fff; padding:.8rem 1.5rem;
           display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; }
  header a { color:#fff; text-decoration:none; }
  header .brand { font-weight:600; font-size:1.15rem; }
  header nav { display:flex; gap:1rem; flex:1; }
  .badge { font-size:.75rem; background:rgba(255,255,255,.18); padding:.15rem .6rem;
           border-radius:999px; }
  main { max-width:980px; margin:1.5rem auto; padding:0 1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:1.2rem 1.4rem; margin-bottom:1.2rem; }
  h1 { font-size:1.5rem; margin:.2rem 0 1rem; } h2 { font-size:1.15rem; margin:0 0 .8rem; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.2rem; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:.4rem 0 .2rem; }
  input, select { width:100%; padding:.55rem .7rem; border:1px solid var(--line);
                  border-radius:8px; font:inherit; }
  button, .btn { display:inline-block; margin-top:.8rem; padding:.55rem 1.1rem; border:0;
                 border-radius:8px; background:var(--accent); color:#fff; font:inherit;
                 cursor:pointer; text-decoration:none; }
  button.secondary { background:#e4e7eb; color:var(--ink); }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:.45rem .5rem; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .flash { background:#fff8e1; border:1px solid var(--gold); border-radius:8px;
           padding:.6rem 1rem; margin-bottom:1rem; }
  .muted { color:var(--muted); } code { background:#eef2f6; padding:.1rem .35rem; border-radius:4px; }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">Snakes &amp; Ladders</a>
  <nav>
    {% if me %}<a href="{{ url_for('lobby') }}">Lobby</a>
    <a href="{{ url_for('logins') }}">Logins</a>{% endif %}
    <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
  </nav>
  <span class="badge" title="Which database version this app is running on">database: {{ mode }}</span>
  {% if me %}<span>{{ me }} · <a href="{{ url_for('logout') }}">log out</a></span>{% endif %}
</header>
<main>
  {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
